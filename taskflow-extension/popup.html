<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366F1"/>
                <stop offset="100%" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
            <rect width="28" height="28" rx="8" fill="url(#logoGradient)"/>
            <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="app-title">TaskFlow</h1>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="add-task-btn" id="addTaskBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Task</span>
        </button>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="category-filters">
        <button class="filter-pill active" data-category="all">All</button>
        <button class="filter-pill" data-category="work">Work</button>
        <button class="filter-pill" data-category="personal">Personal</button>
        <button class="filter-pill" data-category="study">Study</button>
      </div>
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search tasks...">
      </div>
    </div>

    <!-- Task Input Form -->
    <div class="task-form" id="taskForm">
      <div class="form-header">
        <span class="form-title" id="formTitle">New Task</span>
        <button class="close-form-btn" id="closeFormBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="form-body">
        <input type="text" class="task-input" id="taskTitle" placeholder="What needs to be done?" maxlength="200">
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select class="task-select" id="taskCategory">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <div class="priority-selector">
              <button class="priority-btn" data-priority="low">
                <span class="priority-dot low"></span>
                Low
              </button>
              <button class="priority-btn active" data-priority="medium">
                <span class="priority-dot medium"></span>
                Medium
              </button>
              <button class="priority-btn" data-priority="high">
                <span class="priority-dot high"></span>
                High
              </button>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" class="task-date" id="taskDueDate">
        </div>
        <div class="form-actions">
          <button class="cancel-btn" id="cancelBtn">Cancel</button>
          <button class="save-btn" id="saveBtn">Save Task</button>
        </div>
      </div>
    </div>

    <!-- Task List -->
    <div class="task-list-container" id="taskListContainer">
      <div class="task-list" id="taskList">
        <!-- Tasks will be rendered here -->
      </div>
      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-illustration">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="50" fill="var(--empty-circle-bg)" opacity="0.5"/>
            <rect x="35" y="40" width="50" height="8" rx="4" fill="var(--empty-bar)"/>
            <rect x="35" y="56" width="35" height="6" rx="3" fill="var(--empty-bar)" opacity="0.5"/>
            <circle cx="45" cy="75" r="12" fill="var(--accent-primary)" opacity="0.2"/>
            <path d="M41 75L44 78L50 72" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3 class="empty-title">No tasks yet</h3>
        <p class="empty-text">Click "Add Task" to create your first task</p>
      </div>
    </div>

    <!-- Stats Footer -->
    <footer class="stats-footer">
      <div class="stats-item">
        <span class="stats-count" id="totalCount">0</span>
        <span class="stats-label">Total</span>
      </div>
      <div class="stats-divider"></div>
      <div class="stats-item">
        <span class="stats-count" id="activeCount">0</span>
        <span class="stats-label">Active</span>
      </div>
      <div class="stats-divider"></div>
      <div class="stats-item">
        <span class="stats-count" id="completedCount">0</span>
        <span class="stats-label">Done</span>
      </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
      <span class="toast-message" id="toastMessage">Task deleted</span>
      <button class="undo-btn" id="undoBtn">Undo</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
